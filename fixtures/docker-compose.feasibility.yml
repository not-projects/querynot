name: querynot-feasibility

services:
  mysql57:
    image: mysql:5.7.44
    command:
      [
        '--bind-address=0.0.0.0',
        '--tls-version=TLSv1.2',
        '--ssl-ca=/querynot-tls/ca.pem',
        '--ssl-cert=/querynot-tls/server.pem',
        '--ssl-key=/querynot-tls/server-key.pem'
      ]
    environment:
      MYSQL_ROOT_PASSWORD: ${QUERYNOT_FIXTURE_PASSWORD}
    ports:
      - '127.0.0.1:${QUERYNOT_MYSQL57_PORT}:3306'
    volumes:
      - '${QUERYNOT_FIXTURE_INIT_SQL}:/docker-entrypoint-initdb.d/001-querynot.sql:ro'
      - '${QUERYNOT_FIXTURE_TLS}:/querynot-tls:ro'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD --silent'
        ]
      interval: 2s
      timeout: 3s
      retries: 60
    networks: [fixture]

  mysql84:
    image: mysql:8.4.10
    command:
      [
        '--bind-address=0.0.0.0',
        '--tls-version=TLSv1.2',
        '--ssl-ca=/querynot-tls/ca.pem',
        '--ssl-cert=/querynot-tls/server.pem',
        '--ssl-key=/querynot-tls/server-key.pem'
      ]
    environment:
      MYSQL_ROOT_PASSWORD: ${QUERYNOT_FIXTURE_PASSWORD}
    ports:
      - '127.0.0.1:${QUERYNOT_MYSQL84_PORT}:3306'
    volumes:
      - '${QUERYNOT_FIXTURE_INIT_SQL}:/docker-entrypoint-initdb.d/001-querynot.sql:ro'
      - '${QUERYNOT_FIXTURE_TLS}:/querynot-tls:ro'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD --silent'
        ]
      interval: 2s
      timeout: 3s
      retries: 60
    networks: [fixture]

  mariadb114:
    image: mariadb:11.4.12
    command:
      [
        '--bind-address=0.0.0.0',
        '--tls-version=TLSv1.2',
        '--ssl-ca=/querynot-tls/ca.pem',
        '--ssl-cert=/querynot-tls/server.pem',
        '--ssl-key=/querynot-tls/server-key.pem'
      ]
    environment:
      MARIADB_ROOT_PASSWORD: ${QUERYNOT_FIXTURE_PASSWORD}
    ports:
      - '127.0.0.1:${QUERYNOT_MARIADB114_PORT}:3306'
    volumes:
      - '${QUERYNOT_FIXTURE_INIT_SQL}:/docker-entrypoint-initdb.d/001-querynot.sql:ro'
      - '${QUERYNOT_FIXTURE_TLS}:/querynot-tls:ro'
    healthcheck:
      test: ['CMD-SHELL', 'healthcheck.sh --connect --innodb_initialized']
      interval: 2s
      timeout: 3s
      retries: 60
    networks: [fixture]

networks:
  fixture:
    # The harness runs on the host and reaches only the three random ports
    # published above on 127.0.0.1. An internal network has no host gateway and
    # therefore makes those loopback bindings unreachable on Docker Engine.
    driver: bridge
