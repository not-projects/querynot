[graph]
targets = [
  { triple = "x86_64-unknown-linux-gnu" },
  { triple = "x86_64-pc-windows-msvc" },
  { triple = "x86_64-apple-darwin" },
  { triple = "aarch64-apple-darwin" },
]

[advisories]
version = 2
unmaintained = "all"
unsound = "all"
yanked = "deny"
ignore = [
  "RUSTSEC-2026-0370", # zvariant via stable Linux D-Bus/keyring stack; RISK-DEP-005
  "RUSTSEC-2026-0371", # zbus_names via stable Linux D-Bus/keyring stack; RISK-DEP-005
  "RUSTSEC-2026-0372", # zvariant_derive via stable Linux D-Bus/keyring stack; RISK-DEP-005
  "RUSTSEC-2024-0370", # proc-macro-error, build-time via GTK3 macros; RISK-DEP-002
  "RUSTSEC-2024-0411", # GTK3 bindings required by Tauri on Linux; RISK-DEP-001
  "RUSTSEC-2024-0412", # GTK3 bindings required by Tauri on Linux; RISK-DEP-001
  "RUSTSEC-2024-0413", # GTK3 bindings required by Tauri on Linux; RISK-DEP-001
  "RUSTSEC-2024-0414", # GTK3 bindings required by Tauri on Linux; RISK-DEP-001
  "RUSTSEC-2024-0415", # GTK3 bindings required by Tauri on Linux; RISK-DEP-001
  "RUSTSEC-2024-0416", # GTK3 bindings required by Tauri on Linux; RISK-DEP-001
  "RUSTSEC-2024-0417", # GTK3 bindings required by Tauri on Linux; RISK-DEP-001
  "RUSTSEC-2024-0418", # GTK3 bindings required by Tauri on Linux; RISK-DEP-001
  "RUSTSEC-2024-0419", # GTK3 bindings required by Tauri on Linux; RISK-DEP-001
  "RUSTSEC-2024-0420", # GTK3 bindings required by Tauri on Linux; RISK-DEP-001
  "RUSTSEC-2024-0429", # unreachable VariantStrIter API in glib 0.18; RISK-DEP-003
]

[licenses]
version = 2
confidence-threshold = 0.93
unused-allowed-license = "deny"
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
