[workspace]
resolver = "3"
members = ["crates/querynot-core", "crates/querynot-fixture-harness", "src-tauri"]

[workspace.package]
version = "0.1.12"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/not-projects/querynot"
rust-version = "1.94"

[workspace.dependencies]
base64 = "0.22.1"
futures-util = "0.3.31"
keyring = "4.1.6"
pkcs8 = { version = "0.10.2", features = ["encryption", "pem", "std"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
sqlformat = "0.5.0"
sqlparser = "0.62.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-native-roots", "mysql", "sqlite-bundled", "bigdecimal", "chrono", "uuid"] }
thiserror = "2.0.17"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
url = "2.5.8"
uuid = { version = "1.24.0", features = ["serde", "v7"] }
zeroize = { version = "1.9.0", features = ["derive"] }

# Keep fast incremental local builds while limiting debug symbols so Tauri dependency artifacts do not grow unchecked.
[profile.dev]
debug = 1
incremental = true

[profile.dev.package."*"]
debug = 0

[profile.test]
debug = 1
incremental = true

[profile.test.package."*"]
debug = 0

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
