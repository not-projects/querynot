[workspace]
resolver = "3"
members = ["crates/querynot-core", "crates/querynot-fixture-harness", "src-tauri"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/not-projects/querynot"
rust-version = "1.94"

[workspace.dependencies]
async-trait = "0.1.89"
futures-util = "0.3.31"
keyring = "4.1.6"
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
sqlformat = "0.5.0"
sqlparser = "0.62.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-native-roots", "mysql", "sqlite-bundled", "bigdecimal", "chrono", "uuid"] }
thiserror = "2.0.17"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.44"
url = "2.5.8"
uuid = { version = "1.24.0", features = ["serde", "v7"] }
zeroize = { version = "1.9.0", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
