name: Publish reviewed initial release

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful CI run ID that produced the reviewed candidate artifacts
        required: true
        type: string
      confirmation:
        description: Type publish-v0.1.0 after the complete Phase 5 gate passes
        required: true
        type: string

permissions: {}

concurrency:
  group: querynot-initial-release-publication
  cancel-in-progress: false

jobs:
  publish-reviewed-artifacts:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: querynot-windows-x64
          path: artifacts/candidate/windows
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
      - name: Recheck the complete release gate and stage only reviewed bytes
        env:
          PUBLISH_CONFIRMATION: ${{ inputs.confirmation }}
        run: >-
          npm run release:prepare-publication --
          --directory artifacts/candidate
          --output artifacts/publication
          --tag v0.1.0
          --confirm "$PUBLISH_CONFIRMATION"
          --report artifacts/publication-plan.json
      - name: Create and verify an unpublished draft at the audited evidence commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          evidence_commit="$(git rev-parse HEAD)"
          gh release create v0.1.0 artifacts/publication/* --draft --target "$evidence_commit" --title "QueryNot 0.1.0" --notes-file docs/release/initial-release-notes.md
          test "$(gh release view v0.1.0 --json isDraft --jq .isDraft)" = "true"
          test "$(gh release view v0.1.0 --json targetCommitish --jq .targetCommitish)" = "$evidence_commit"
      - name: Round-trip the draft assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v0.1.0 --dir artifacts/release-roundtrip
      - name: Verify the draft bytes before publication
        run: >-
          npm run release:verify-publication --
          --directory artifacts/release-roundtrip
          --tag v0.1.0
          --report artifacts/publication-verification.json
      - name: Publish the verified draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit v0.1.0 --draft=false --latest
      - uses: actions/upload-artifact@v4
        with:
          name: querynot-v0.1.0-publication-evidence
          if-no-files-found: error
          path: |
            artifacts/publication-plan.json
            artifacts/publication-verification.json
