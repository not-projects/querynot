name: Publish reviewed signed release

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful master CI run ID that produced the reviewed signed candidate
        required: true
        type: string
      confirmation:
        description: Type publish-v<package-version> after reviewing the candidate
        required: true
        type: string

permissions: {}

concurrency:
  group: querynot-signed-release-publication
  cancel-in-progress: false

jobs:
  publish-reviewed-artifacts:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Resolve the exact successful CI candidate source
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}")"
          test "$(jq -r .name <<<"$run_json")" = "CI"
          test "$(jq -r .event <<<"$run_json")" = "workflow_dispatch"
          test "$(jq -r .head_branch <<<"$run_json")" = "master"
          test "$(jq -r .conclusion <<<"$run_json")" = "success"
          candidate_sha="$(jq -r .head_sha <<<"$run_json")"
          test "${#candidate_sha}" = "40"
          echo "sha=$candidate_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ steps.candidate.outputs.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: querynot-windows-x64
          path: artifacts/candidate/windows
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
      - name: Resolve and confirm the candidate version
        id: release
        env:
          PUBLISH_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          test "$PUBLISH_CONFIRMATION" = "publish-${tag}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Verify and stage only the four signed release assets
        env:
          PUBLISH_CONFIRMATION: ${{ inputs.confirmation }}
          QUERYNOT_UPDATER_PUBLIC_KEY: ${{ vars.QUERYNOT_UPDATER_PUBLIC_KEY }}
        run: >-
          npm run release:prepare-update-publication --
          --directory artifacts/candidate
          --output artifacts/publication
          --tag "${{ steps.release.outputs.tag }}"
          --confirm "$PUBLISH_CONFIRMATION"
          --report artifacts/publication-plan.json
      - name: Create and verify an unpublished draft at the candidate commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_SOURCE: ${{ steps.candidate.outputs.sha }}
        run: |
          gh release create "$RELEASE_TAG" artifacts/publication/* --draft --target "$RELEASE_SOURCE" --title "QueryNot $RELEASE_VERSION" --notes-file "docs/release/${RELEASE_VERSION}-notes.md"
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = "true"
          test "$(gh release view "$RELEASE_TAG" --json targetCommitish --jq .targetCommitish)" = "$RELEASE_SOURCE"
      - name: Round-trip the draft assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: gh release download "$RELEASE_TAG" --dir artifacts/release-roundtrip
      - name: Verify the draft bytes before publication
        env:
          QUERYNOT_UPDATER_PUBLIC_KEY: ${{ vars.QUERYNOT_UPDATER_PUBLIC_KEY }}
        run: >-
          npm run release:verify-update-publication --
          --directory artifacts/release-roundtrip
          --tag "${{ steps.release.outputs.tag }}"
          --report artifacts/publication-verification.json
      - name: Publish the verified draft as the stable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
      - uses: actions/upload-artifact@v4
        with:
          name: querynot-${{ steps.release.outputs.tag }}-publication-evidence
          if-no-files-found: error
          path: |
            artifacts/publication-plan.json
            artifacts/publication-verification.json
