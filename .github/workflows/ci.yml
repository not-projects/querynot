name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  change-scope:
    runs-on: ubuntu-24.04
    outputs:
      full: ${{ steps.scope.outputs.full }}
      reason: ${{ steps.scope.outputs.reason }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Classify documentation-only changes
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/ci-change-scope.mjs --base "$BASE_SHA" --head "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  frontend-and-policy:
    needs: change-scope
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:contracts
      - run: npm run test:traceability
      - run: npm run test:unit
      - run: npm run format:check
      - run: npm run test:dependencies
        if: needs.change-scope.outputs.full == 'true'
      - run: npm audit --audit-level=high
        if: needs.change-scope.outputs.full == 'true'
      - run: npm run check
        if: needs.change-scope.outputs.full == 'true'
      - name: Install Chromium for UI layout checks
        if: needs.change-scope.outputs.full == 'true'
        run: npx playwright install --with-deps chromium
      - run: npm run test:ui-layout
        if: needs.change-scope.outputs.full == 'true'
      - run: npm run build
        if: needs.change-scope.outputs.full == 'true'

  native-core:
    needs: change-scope
    if: needs.change-scope.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-22.04
          - ubuntu-24.04
          - windows-2022
          - macos-15
          - macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy,rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./ -> target
          key: ${{ matrix.runner }}
      - run: cargo test --locked -p querynot-core
      - run: cargo clippy --locked -p querynot-core --all-targets -- -D warnings

  native-dependency-review:
    needs: change-scope
    if: needs.change-scope.outputs.full == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./ -> target
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny check advisories licenses bans sources

  desktop-linux:
    needs: change-scope
    if: needs.change-scope.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Tauri system dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./ -> target
          key: ${{ matrix.runner }}
      - run: npm ci
      - run: cargo check --locked --workspace --all-targets

  desktop-windows-macos:
    needs: change-scope
    if: needs.change-scope.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./ -> target
          key: ${{ matrix.runner }}
      - run: npm ci
      - run: cargo check --locked --workspace --all-targets
