name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-and-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: npm
      - run: npm ci
      - run: npm run test:contracts
      - run: npm run test:traceability
      - run: npm run test:dependencies
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: npm run test:unit
      - run: npm run build
      - run: npm run format:check

  native-core:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-22.04
          - ubuntu-24.04
          - windows-2022
          - macos-15
          - macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          components: clippy,rustfmt
      - run: cargo test --locked -p querynot-core
      - run: cargo clippy --locked -p querynot-core --all-targets -- -D warnings

  native-dependency-review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny check advisories licenses bans sources

  desktop-linux:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
      - run: npm ci
      - run: cargo check --locked --workspace --all-targets

  desktop-windows-macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
      - run: npm ci
      - run: cargo check --locked --workspace --all-targets

  disposable-feasibility:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
      - run: npm ci
      - run: npm run test:feasibility
      - uses: actions/upload-artifact@v4
        with:
          name: phase-0-feasibility
          path: evidence/phase-0/feasibility-report.json
