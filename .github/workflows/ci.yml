name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-and-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:contracts
      - run: npm run test:traceability
      - run: npm run test:dependencies
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: npm run test:unit
      - name: Install Chromium for UI layout checks
        run: npx playwright install --with-deps chromium
      - run: npm run test:ui-layout
      - run: npm run build
      - run: npm run format:check

  native-core:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-22.04
          - ubuntu-24.04
          - windows-2022
          - macos-15
          - macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy,rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./ -> target
          key: ${{ matrix.runner }}
      - run: cargo test --locked -p querynot-core
      - run: cargo clippy --locked -p querynot-core --all-targets -- -D warnings

  native-dependency-review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./ -> target
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny check advisories licenses bans sources

  desktop-linux:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Tauri system dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./ -> target
          key: ${{ matrix.runner }}
      - run: npm ci
      - run: cargo check --locked --workspace --all-targets

  desktop-windows-macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./ -> target
          key: ${{ matrix.runner }}
      - run: npm ci
      - run: cargo check --locked --workspace --all-targets

  checksum-pinned-feasibility:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./ -> target
      - run: npm ci
      - run: npm run fixtures:fetch:native
      - run: npm run test:feasibility:native
      - uses: actions/upload-artifact@v4
        with:
          name: phase-0-feasibility
          path: evidence/phase-0/feasibility-report.json

  release-candidate-packages:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            package_script: package:windows
            binary: target/release-candidate-windows/release/querynot.exe
            bundle_directory: target/release-candidate-windows/release/bundle
            expected_formats: nsis
            artifact_name: querynot-windows-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./ -> target
          key: ${{ matrix.runner }}
      - run: npm ci
      - run: npm run ${{ matrix.package_script }}
      - name: Prepare retained candidate records
        run: node -e "require('node:fs').mkdirSync('artifacts/release-candidate',{recursive:true})"
      - name: Inspect candidate package
        run: npm run release:inspect -- --binary ${{ matrix.binary }} --directory ${{ matrix.bundle_directory }} --expect ${{ matrix.expected_formats }} --report artifacts/release-candidate/inspection.json
      - name: Hash candidate package
        run: npm run release:checksums -- --directory ${{ matrix.bundle_directory }} --output artifacts/release-candidate/SHA256SUMS --manifest artifacts/release-candidate/checksums.json
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: error
          path: |
            target/release-candidate-*/release/bundle/**/*.exe
            artifacts/release-candidate/**

  release-candidate-checksums:
    if: github.event_name == 'workflow_dispatch'
    needs: release-candidate-packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          pattern: querynot-*
          path: artifacts/all-packages
      - run: npm ci
      - run: npm run release:checksums -- --directory artifacts/all-packages --output artifacts/SHA256SUMS --manifest artifacts/checksums.json
      - uses: actions/upload-artifact@v4
        with:
          name: querynot-release-candidate-checksums
          if-no-files-found: error
          path: |
            artifacts/SHA256SUMS
            artifacts/checksums.json
