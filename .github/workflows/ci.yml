name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  change-scope:
    runs-on: ubuntu-24.04
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Classify CI change scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/ci-change-scope.mjs --base "$BASE_SHA" --head "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Summarize CI scope
        run: echo "CI scope is ${{ steps.scope.outputs.scope }} (${{ steps.scope.outputs.reason }})." >> "$GITHUB_STEP_SUMMARY"

  frontend-and-policy:
    needs: change-scope
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:contracts
      - run: npm run test:traceability
      - run: npm run test:unit
      - run: npm run format:check
      - run: npm run test:dependencies
        if: needs.change-scope.outputs.scope != 'documentation'
      - run: npm audit --audit-level=high
        if: needs.change-scope.outputs.scope != 'documentation'
      - run: npm run check
        if: needs.change-scope.outputs.scope != 'documentation'
      - name: Install Chromium for UI layout checks
        if: needs.change-scope.outputs.scope != 'documentation'
        run: npx playwright install --with-deps chromium
      - run: npm run test:ui-layout
        if: needs.change-scope.outputs.scope != 'documentation'
      - run: npm run build
        if: needs.change-scope.outputs.scope != 'documentation'

  rust-quality:
    needs: change-scope
    if: needs.change-scope.outputs.scope != 'documentation' && needs.change-scope.outputs.scope != 'frontend'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy,rustfmt
      - name: Resolve Rust dependency cache key
        id: rust-cache-key
        run: node scripts/rust-dependency-cache-key.mjs
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./ -> target
          shared-key: ci-ubuntu-24-rust-quality
          key: dependencies-${{ steps.rust-cache-key.outputs.key }}
          add-rust-environment-hash-key: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
      - run: cargo fmt --all -- --check
      - run: cargo test --locked -p querynot-core
      - run: cargo clippy --locked -p querynot-core --all-targets -- -D warnings

  native-dependency-review:
    needs: change-scope
    if: needs.change-scope.outputs.scope != 'documentation' && needs.change-scope.outputs.scope != 'frontend'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./ -> target
          shared-key: ci-ubuntu-24-dependency-review
          key: cargo-deny-0.20.2
          add-rust-environment-hash-key: false
          cache-targets: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny check advisories licenses bans sources

  platform-compile:
    needs: change-scope
    if: needs.change-scope.outputs.scope != 'documentation' && needs.change-scope.outputs.scope != 'frontend'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target_id: linux-x64
            cache_id: ubuntu-22-x64
          - runner: windows-2022
            target_id: windows-x64
            cache_id: windows-2022-x64
          - runner: macos-15
            target_id: macos-aarch64
            cache_id: macos-15-aarch64
          - runner: macos-15-intel
            target_id: macos-x64
            cache_id: macos-15-x64
    name: platform-compile (${{ matrix.target_id }})
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@1.97.0
      - name: Resolve Rust dependency cache key
        id: rust-cache-key
        run: node scripts/rust-dependency-cache-key.mjs
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./ -> target
          shared-key: ci-${{ matrix.cache_id }}-platform
          key: dependencies-${{ steps.rust-cache-key.outputs.key }}
          add-rust-environment-hash-key: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
      - run: npm ci
      - name: Test Windows core behavior
        if: runner.os == 'Windows'
        run: cargo test --locked -p querynot-core
      - run: cargo check --locked --workspace --all-targets
