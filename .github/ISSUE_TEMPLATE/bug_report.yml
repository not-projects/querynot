name: Bug report
description: Report a reproducible QueryNot problem without sharing secrets or private data.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve QueryNot. Remove credentials, connection strings, private certificates, production data, and sensitive query results before submitting.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use a synthetic or disposable database and provide the smallest reliable sequence.
      placeholder: |
        1. Open ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: QueryNot version or commit
      placeholder: master at abc1234
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS 15, Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: database
    attributes:
      label: Database engine and version
      description: Do not include a hostname, username, connection string, or database name.
      placeholder: PostgreSQL 17
  - type: textarea
    id: evidence
    attributes:
      label: Redacted logs or screenshots
      description: Optional. Remove secrets, private data, and identifying infrastructure details.
  - type: checkboxes
    id: safety
    attributes:
      label: Data-safety confirmation
      options:
        - label: I removed credentials, connection strings, private certificates, production data, and sensitive query results.
          required: true
        - label: I used a synthetic or disposable database for reproduction, or explained why that was not possible.
          required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: This report is not a public vulnerability disclosure.
          required: true
